name: Build and Publish Sonar .NET 10 Image

on:
  push:
    tags:
      - "v*"
    # branches:
    #   - main
  # workflow_dispatch:

env:
  IMAGE_NAME: aloknecessary/sonar-dotnet-v10.0

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and smoke test image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: sonar-dotnet-v10-smoke:${{ github.sha }}

      - name: Verify image tools and user
        run: |
          docker run --rm sonar-dotnet-v10-smoke:${{ github.sha }} sh -c '\
            dotnet --info && \
            dotnet sonarscanner && \
            test "$(id -u)" = "1001" && \
            test -w /workspace'

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag

      - name: Build and Push (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          # platforms: linux/amd64
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
